name: Run metric extraction (CIMET's ISAR metrics module)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch or tag) of spinnaker/spinnaker to analyze'
        required: false
        default: 'main'

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cimet
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Cimet
        run: mvn -B -ntp clean install -DskipTests

      - name: Determine Spinnaker commit range (last 2 months)
        id: commits
        env:
          TARGET_REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags --single-branch --branch "${TARGET_REF}" https://github.com/spinnaker/spinnaker.git spinnaker
          cd spinnaker
          NEW_COMMIT=$(git rev-parse HEAD)
          BEFORE_DATE=$(date -u -d '2 months ago' '+%Y-%m-%dT%H:%M:%SZ')
          echo "Using commits up to $BEFORE_DATE" >> "$GITHUB_STEP_SUMMARY"
          OLD_COMMIT=$(git rev-list -n 1 --before="$BEFORE_DATE" HEAD)
          if [ -z "$OLD_COMMIT" ]; then
            OLD_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          echo "Old commit: $OLD_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "New commit: $NEW_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "old_commit=$OLD_COMMIT" >> "$GITHUB_OUTPUT"
          echo "new_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Prepare Spinnaker configuration
        env:
          TARGET_REF: ${{ inputs.ref || 'main' }}
        run: |
          cat <<JSON > config.json
          {
            "systemName": "Spinnaker",
            "repositoryURL": "https://github.com/spinnaker/spinnaker.git",
            "branch": "${TARGET_REF}",
            "baseBranch": "${TARGET_REF}"
          }
          JSON

      - name: Run CIMET ISAR metrics extraction
        env:
          OLD_COMMIT: ${{ steps.commits.outputs.old_commit }}
          NEW_COMMIT: ${{ steps.commits.outputs.new_commit }}
        run: |
          echo "Calculating metrics for commits $OLD_COMMIT -> $NEW_COMMIT"
          mvn -P run-metrics exec:java -Dexec.args="./config.json ${OLD_COMMIT} ${NEW_COMMIT}" -DskipTests

      - name: List generated artifacts
        run: |
          echo "Workspace contents:"
          ls -R output || true

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: spinnaker-metrics-${{ github.run_id }}
          path: |
            output/metrics-summary.txt
          if-no-files-found: error
